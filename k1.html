a ile ilgili ciddi sağlık problemleri olanlara:\n🔹 Boyun fıtığı ileri seviyede olanlar\n🔹 Omurga instabilitesi (gevşekliği) olanlar\n🔹 Omurga kırığı ya da tümörü olanlar\n🔹 Osteoporozu (kemik erimesi) olan bireyler\n🔹 Damar hastalığı riski yüksek olanlar (örneğin vertebrobaziler yetmezlik)\n🔹 İnme geçirme riski taşıyan bireyler\n\n📌 Peki, bilinçsiz yapılan boyun kütletmenin riskleri var mı?\nEvet! Kontrolsüz ve yanlış yapılan manipülasyonlar; sinir sıkışmalarına, damarlara baskıya ve ciddi sağlık sorunlarına neden olabilir. Bu yüzden mutlaka uzman bir fizyoterapist ya da manuel terapist tarafından değerlendirilmelisiniz.\n\n🧐 Boyun manipülasyonu hakkında ne düşünüyorsunuz? Daha önce denediniz mi? Yorumlarda paylaşın!\n\n📌 Beğenmeyi, kaydetmeyi ve paylaşmayı unutmayın! 💖\n.\n.\n.\n.\n.\n.\n.\n.\n.\n.\n.\n.\n.\n.\n.\n.\n\n#BoyunManipülasyonu #Fizyoterapi #ManuelTerapi #BoyunAğrısı #ServikalManipülasyon #BoyunKütletme #BoyunFıtığı #OmurgaSağlığı #PostürDüzeltme #AğrısızYaşam #KasSpazmı #BoyunHareketliliği #BaşAğrısı #BoyunEgzersizleri #FizikTedavi #OmurgaHareketi #KasGüçlendirme #SağlıklıOmurga #SinirBaskısı #OmurgaTerapisi #ServikalBölge #AğrıYönetimi #FizikselSağlık #EklemMobilizasyonu #BoyunEsnekliği #KronikAğrı #SporcuSağlığı #DuruşBozukluğu #OmurgaRahatsızlıkları #FizyoterapistÖneriyor", "yerlestirilebilir": "1"}, {"sira": "40", "video_id": "upH9ctH0evQ", "baslik": "Boyun Fıtığı ve Belirtileri - Prof. Dr. İlker Solmaz", "kanal": "Cerrahi Hastanesi", "yukleme_tarihi": "2021-01-11", "sure_sn": "225", "shorts": "0", "aciklama": "Beyin ve Sinir Cerrahisi Uzmanlarımızdan Prof. Dr. İlker Solmaz, Boyun Fıtığı ve Belirtileri hakkında önemli bilgilendirmelerde bulundu.", "yerlestirilebilir": "1"}, {"sira": "41", "video_id": "X5EFuvVvpGg", "baslik": "Ani işitme kaybı mümkün mü?", "kanal": "Liv Hospital Group", "yukleme_tarihi": "2025-05-16", "sure_sn": "69", "shorts": "1", "aciklama": "", "yerlestirilebilir": "1"}, {"sira": "42", "video_id": "W5dYZbtsn_s", "baslik": "Mekani ise #yoga #pilates #youtubeshorts", "yerlestirilebilir": "1"}, {"sira": "74", "video_id": "ZxNEUc61Ono", "baslik": "BEL KAYMASINI DÜZELTEN 4 DAKİKALIK EGZERSİZ PROGRAMI", "kanal": "Şifa Bul", "yukleme_tarihi": "2020-05-07", "sure_sn": "346", "shorts": "0", "aciklama": "#belkayması #belkaymasıtedavisi #belkaymasıegzersizleri #belegzersizleri #belağrısı #belağrısıegzersizleri #şifabul #şifabulun #sağlık #sağlıklıyaşam #sağlıklıbeslenme #sağlıkbilgileri #sağlıkhaberleri #sağlıktavsiyeleri #faydalıbilgiler\n\nBel kayması kuyruk sokumuna en yakın olan L4 omurunun L5 üzerine doğru kaymasıdır. Bel kayması doğuştan gelen anatomik sorunlar, kireçlenme gibi kemik hastalıkları, kalça üzerine hızla düşmek, omurgayı zorlayan darbeler, ağır kaldırmak ve yaşlılık nedeniyle oluşan kas ve bağların zayıflamasıyla ortaya çıkabilir. Bu rahatsızlık bel ağrılarına, uyluk ve bacaklarda karıncalanma ve hissizliğe, bacaklarda kuvvet kaybına ve belde şekil bozukluğu gibi belirtilere yol açabilir. Çok şiddetli ağrıya veya omurga eğriliğine neden olmadığı sürece çoğu bel kayması fizik tedavi gibi uygulamalarla cerrahi müdahale olmaksızın iyileştirilebilmektedir. Şimdi vereceğimiz kısa ama etkili egzersiz programıyla bel ve karın kaslarını güçlendirerek bu rahatsızlıktan kurtulabilirsiniz. Egzersizle iyileşebilecek tipte bir bel kayması yaşayıp yaşamadığınızı mutlaka doktorunuza danışmanız gereklidir. Hazırsanız egzersizlerimize başlayalım:\n1- LEĞEN KEMİĞiNİ EĞME EGZERSİZİ\n2- DİZLERİ GÖĞÜSE ÇEKME EGZERSİZİ\n3- YERDE UZANARAK HEMSTRİNG KASINI GERME EGZERSİZİ\n4- YARIM MEKİK\n5- ÖLÜ BÖCEK EGZERSİZİ \n\nKaynakça:\n1. https://www.braceability.com/blogs/articles/spondylolisthesis-exercises\n2. https://www.healthline.com/health/fitness-exercise/spondylolisthesis-exercises#exercises-for-pain-relief\n3. https://www.medicalpark.com.tr/bel-kaymasi/hg-2157\n4. https://www.florence.com.tr/bel-kaymasi\n5. https://www.acibadem.com.tr/omurgasagligimerkezi/bel-kaymasi/\n6. https://www.haberturk.com/bel-kayma iyi huylu ancak acil servislere başvurulmasına neden olan bir tablodur. Genellikle kulak burun boğaz uzmanları tarafından göz hareketlerine bakılarak yapılan manevralarla takip ve tedavisi sürdürülmektedir. Beyin dışındaki diğer nedenlerin bir kısmında da stresör faktörler, boyun kas iskelet sistemine ait bir takım anomaliler, bazı madde kullanımı da etkili olmaktadır. Beyne ait nedenlerde baş dönmesinin %25'lik kısmını oluşturmaktadır. Özellikle acile başvurularda iyi bir fizik muayene çok önemlidir.\n\nBaş Dönmesinde Muayene Nasıl Yapılır?\nBaş dönmesinin merkezi sinir sistemine veya periferik sisteme ait olup olmadığının anlaşılabilmesi için iyi bir fizik tedavi muayenesi yapılması gerekmektedir.\nMerkezi sinir sisteminde; beyin tümörleri, anevrizmalar, enfeksiyonlar, yer kaplayıcı lezyonlar ve damar tıkanıklıkları gibi hastalıklara baş dönmesi eşlik edebileceği gibi kronik bir takım nörolojik hastalıklarda da baş dönmesi görülmektedir.\n\nMerkezi sinir sistemine ait olan baş dönmelerinin en büyük özelliği baş dönmesi hissi yanında bir takım nörolojik bulguların da eşlik ediyor olmasıdır. Bunlar kollarda, bacaklarda kuvvetsizlik, dengesizlik, çift görme, yutma güçlüğü gibi sorunları da beraberinde getirmektedir.\n\nBöyle Durumlarda Ne Yapılmaktadır?\nFizik muayene sonrasında beyin görüntülemelerine başvurulmaktadır. Beyin görüntülemelerinde MR (Manyetik Rezonans Görüntüleme), beyin damarlarını görmek için MR anjiyo ve beyne giden kan damarlarının beslenmesini herhangi bir tıkanıklık olup olmadığını görmek amacıyla da renkli dopplerler kullanılmaktadır.\n\nMedipol Koşuyolu Hastanesinde, baş dönmesine neden olan hastalıklara yönelik tedaviler farklı birimlerin bir araya geldiği multidisipliner (çok branşlı) yaklaşımla planlanmaktadır.\n\nUzm. Dr. Cevdet Bilge\nNöroloji Uzmanı\nMedipol Koşuyolu Hastanesi / Medipol Üniversitesi Pendik Hastanesi\n\nBilgi ve randevu için\nMedipol Koşuyolu Hastanesi 0216 544 66 66 I https://bit.ly/3EFAIyI\nMe", "yerlestirilebilir": "1"} ğlık sorunlarının bir belirtisi olarak ortaya çıkabilir. Bu nedenle uzun süren veya yaşam kalitesini etkileyen çınlamalarda uzman değerlendirmesi ihmal edilmemelidir.\n\n🔎 Doğru tanı, uygun tedavi planının ilk adımıdır.\n\n\n#KulakÇınlaması #Tinnitus #KBB #AliRahimi #NPİSTANBUL", "yerlestirilebilir": "0"}, {"sira": "108", "video_id": "gOHFptG8pnw", "baslik": "Learn How To Do a Seated #Neck Manipulation ✅ OMT Training #chiropractic techniques", "kanal": "OMT Training ", "yukleme_tarihi": "2025-05-22", "sure_sn": "6", "shorts": "1", "aciklama": "https://online.omttraining.co.uk/course/mobilisation\n\nOMT Training - Online & In-person Training for Chiropractors, Manual Therapists, and Osteopaths ✅\n\n#omttraining #physiotherapy #osteopathic", "yerlestirilebilir": "1"}, {"sira": "109", "video_id": "sqkBnu6PbR8", "baslik": "Boyun kütletmek işitme kaybına iyi gelir mi?", "kanal": "Op. Dr. Tahsin Saygı", "yukleme_tarihi": "2026-05-05", "sure_sn": "110", "shorts": "1", "aciklama": "Boyun kütletmek işitme kaybına iyi gelir mi? 🤔\nİnternette bu konuda birbirine tamamen zıt videolar görmeniz çok normal. Kimi “mucizevi şekilde işitme düzeldi” diyor, kimi ise “hiçbir faydası yok, hatta zararlı olabilir” diyor.\n\nÖncelikle şunu bilmelisiniz:\n👉 İşitme kaybında ilk başvurulacak bölüm Kulak Burun Boğaz (KBB) uzmanıdır.\nKBB hekimi muayene eder, gerekli tedaviyi uygular ve gerekirse işitme cihazı önerir.\n\nPeki tüm tetkikler normal, tedaviler başarısız ve sebep hâlâ bulunamamışsa?\nİşte burada boyun manipülasyonunun (kütletme) işitme kaybına fayda etme ihtimali vardır.\n📌 Literatürde bu konuda yayınlar mevcuttur.\n📌 Etki ihtimali ortalama %30 civarındadır.\n\nAncak çok önemli bir nokta var:\nBoyun manipülasyonu küçük de olsa risk taşıyan bir işlemdir.\n🔸 Boyun damarlarına zarar verebilir\n🔸 Omuriliği etkileyebilir\n\nBu nedenle mutlaka:\n✔️ Önce beyin cerrahisi muayenesi olmalı\n✔️ MR görüntüleri değerlendirilmelidir\n✔️ İşlem yalnızca uzman kişiler tarafından yapılmalıdır\n\nSonuç olarak; sebebi bulunamayan işitme kayıplarında boyun manipülasyonu bir seçenek olabilir, ancak kontrolsüz uygulanması ciddi risk taşır. ⚠️", "yerlestirilebilir": "1"}, {"sira": "110", "video_id": "9W3nlS8W0SA", "baslik": "🔴 Boynunu kütlettirdi; hayatını kaybetti", "kanal": "Gloob", "yukleme_tarihi": "2026-09-10", "sure_sn": "51", "shorts": "1", "aciklama": "🔴 Boynunu kütlettirdi; hayatını kaybetti\n\n👉🏻 İstanbul’da gerçekleşen olayda sırt ve boyun ağrısı yaşayan Berat Topay, boynuna çekme ve kütletme işlemi uygulatmasının hemen ardından fenalaştı ve kaldırıldığı hastanede hayatını kaybetti.\n\nKadriye Örgen anlattı 🎙️\n\n#boyunkütletme #masaj #istanbul #haber #gündem", "yerlestirilebilir": "1"}, {"sira": "111", "video_id": "JOFzvOsOFMo", "baslik": "Boyun fıtığı fizik tedavi ile iyileşebilir mi?", "kanal": "Doktorsitesi.com", "yukleme_tarihi": "2017-01-13", "sure_sn": "45", "shorts": "0", "aciklama": "İletişim & Randevu: 0 (850) 811 76 40 \nOp. Dr. E. Onur KULAKSIZOĞLU - https://www.doktorsitesi.com/doktor-e-onur-kulaksizoglu/beyin-ve-sinir-cerrahisi/istanbul \n Boyun fıtığı olan hastaların ameliyata aday olanlarını ciddi bir şekilde ayırmamız gerekir. Bu hastalara cerrahi dışında bir tedavi uygulamak hata olur. Özellikle omurilik basısının ciddi olduğu durumdaki hastalara; omurilik tehditlerinin çok ileri olduğu ve boyun ağrısı, kol ağrısı şikayetlerinin  yanında kuvvetsizliklerin de eşlik ettiği hastalara ameliyat dışında başka tedavi uygulamak anlamlı değildir, özellikle fizik tedavi.  Fizik tedavi uygulayacağımız diğer %96 lık kısma eğer yerinde ve zamanında müdahale ettiysek, fizik tedavi ile hastaların %100 e yakın oranda iyileşmeleri mümkündür. Boyun fıtığının başlangıcında veya boyun düzleşmesinde fizik tedavinin %100 e yakın faydası vardır.\n\n https://www.doktorsitesi.com/ \n https://www.facebook.com/drsitesi\n https://twitter.com/doktorsitesi \n https://www.instagram.com/doktorsitesi/", "yerlestirilebilir": "1"}, {"sira": "112", "video_id": "N8ZvJDya6dg" : "Boyun Fıtığı Kulakta Çınlama ve Baş Dönmesi Yapar Mı?\n\nFizyoterapi ve Rehabilitasyon Uzmanı Doç. Dr. Kerem ALPTEKİN'in konuk olduğu Beyaz TV - İyi Ki Varsın programından izliyoruz. \n\n#alptekin #alptekinfiziktedavi #fiziktedavi #docdrkeremalptekin #keremalptekin", "yerlestirilebilir": "1"}, {"sira": "205", "video_id": "2wDqJdO3_Ug", "baslik": "Bel ve Boyun Ağrılarında Manipülasyon ( Manuel Terapi ) Kanal D Doktorum Uzm. Dr. Ali Şahabettinoğlu", "kanal": "Stratejik İletişim Ortaklığı", "yukleme_tarihi": "2014-05-15", "sure_sn": "1231", "shorts": "0", "aciklama": "Uzm. Dr. Ali Şahabettinoğlu\nwww.manuelinternational.com\nwww.maniplasyonmerkezi.com", "yerlestirilebilir": "1"}, {"sira": "206", "video_id": "NdegGIBpz6M", "baslik": "Geçmeyen Kulak Çınlaması Teşhisi / Kulak Çınlaması Nasıl Anlaşılır", "kanal": "Tedavisi Nedir", "yukleme_tarihi": "2025-09-14", "sure_sn": "113", "shorts": "1", "aciklama": "Uzun süreli kulak çınlaması altta yatan bir durumun işareti olabilir. 🧐 Teşhis için kapsamlı bir değerlendirme gerekir.\n\n​Yapılan testler:\n\n👂 İşitme Testleri: Duyma seviyenizi ve çınlamanızın frekansını belirler.\n\n🧠 Nörolojik Testler: ABR gibi testlerle sinir yollarınızın işleyişi incelenir.\n\n🔬 Görüntüleme: MR ile beyin veya iç kulaktaki yapısal sorunlar araştırılır.\n\n💉 Kan Tahlilleri: B12 eksikliği, tiroid veya sistemik hastalıklar kontrol edilir.\n\n_____\nIf you have persistent ringing in your ears, it is important to have some tests done to understand the underlying cause.\n​Persistent tinnitus does not only affect the auditory system, but can sometimes also indicate neurological or systemic diseases. Therefore, a multifaceted approach is required for diagnosis.\n​The following tests are generally recommended:\n​Hearing tests are done to understand how well your ears hear which sounds. If necessary, very high-frequency sounds, for example up to 20 thousand hertz, are also tested.\n​There are also tests to measure the frequency or intensity of your tinnitus, which will be helpful in making a differential diagnosis. These are special tests used to measure how loud and at what pitch the tinnitus you hear is. This is important for correct treatment.\n​We can also do some brain-related tests, called electrophysiological tests. These are special tests to understand how the brain and nerves transmit sounds. With tests such as Auditory Brainstem Response (ABR), we evaluate the neural transmission of the auditory pathways.\n​Magnetic Resonance (MR) imaging is used to check for structural conditions in the brain or inner ear that may cause ringing, such as a tumor or vascular abnormalities. Sometimes, a special MR test that shows brain functions, called a functional MR, may also be required.\n​In addition, blood tests can help us understand other conditions that may cause ringing, such as B12 deficiency, thyroid problems, or immune system problems\n\n#profdrcemdevge #kulakçınlaması #tinnitus #kulaksağlığı #işitmekaybı #tedavisinedir #tinnitusawareness #hearinghealth #ringingears", "yerlestirilebilir": "1"}, {"sira": "207", "video_id": "Ukrt_Ktzgrk", "baslik": "Boyun ve Bel Fıtığı Nedir Nasıl Tedavi Edilir - Uzm. Dr. Oya GÜLEÇ", "kanal": "Özel Göztepe Hastanesi", "yukleme_tarihi": "2016-05-04", "sure_sn": "151", "shorts": "0", "aciklama": "Detaylı Bilgi ve Randevu İçin: www.goztepehastanesi.com.tr 0216 565 40 65", "yerlestirilebilir": "1"}, {"sira": "208", "video_id": "0VFe7mfta94", "baslik": "Bel Fıtığı Sebepleri - Bel ve Boyunda Düzleşme - Eklem Ağrıları", "kanal": "Mecit Korkut", "yukleme_tarihi": "2018-10-28", "sure_sn": "446", "shorts": "0", "aciklama": "Arkadaşlar Sakın  eğitimini almadan denemeyin! Kalıcı hasarlara sebep olabilirsiniz (Felç gibi)...\n\nZekeriya Hocamız işinin ehlidir,güvenle gidebilirsiniz,ben faydasını gördüm! Gönül rahatlığıyla sizlere'de tavsiye ediyorum :)\n\nÎskelet her yaşta herkeste kullanma ve zorlamaya bağlı olarak deformasyonlar yaşar. \nBu sebeple  tamir bakım onarıma muhtaç bir mekanik bir larla birlikte\nvestibüler rehabilitasyon egzersizleri ile denge hissini yeniden yapılandırmayı hedefler.\n\nKaynak: Wrisley DM, Sparto PJ, Whitney SL, Furman JM. Cervicogenic dizziness: A review of diagnosis and treatment.\nJ Orthop Sports Phys Ther. 2000;30(12):755–766.\n\n📌 Bu video bilgilendirme amaçlıdır. Teşhis, tanı veya tedavi yerine geçmez.\nDeğerlendirmeler, ilgili hekimlik tanısı sonrasında fizyoterapist tarafından mesleki yetkinlik çerçevesinde yapılmalıdır.\n\n​English\n\nNot every episode of dizziness originates from the ear.\nSometimes, the imbalance comes from the silent whisper of the neck.\n\nResearch shows that misalignment of the cervical vertebrae and muscle tension\ncan alter signals sent to the brain’s balance center, leading to cervicogenic dizziness.\nPhysiotherapy science aims to restore postural alignment and rebuild balance perception\nthrough targeted manual therapy and vestibular rehabilitation exercises.\n\nReference: Wrisley DM, Sparto PJ, Whitney SL, Furman JM. Cervicogenic dizziness: A review of diagnosis and treatment.\nJ Orthop Sports Phys Ther. 2000;30(12):755–766.\n\n📌 This video is for informational purposes only. It does not constitute diagnosis or treatment.\nAssessments should be performed by physiotherapists within their professional competence, following a medical diagnosis.\n\n#başdönmesi #vertigo #servikojenikvertigo", "yerlestirilebilir": "1"}, {"sira": "215", "video_id": "3xMERiqEub4", "baslik": "BOYUN FITIĞI TEK EGZERSİZ #boyunfıtığı #egzersiz", "kanal": "Fizyoterapist Şule Doğan", "yukleme_tarihi": "2023-07-08", "sure_sn": "25", "shorts": "1", "aciklama": "", "yerlestirilebilir": "1"}, {"sira": "216", "video_id": "hx_MA2w14h4", "baslik": "ENSEDEN GELEN BAŞ AĞRISI Neden Olur?", "kanal": "Sağlıkta Yenilikler", "yukleme_tarihi": "2024-06-06", "sure_sn": "281", "shorts": "0", "aciklama": "Enseden gelen baş ağrısı, genellikle boyun bölgesindeki kasların gerilmesi veya spazmı sonucu ortaya çıkan bir tür baş ağrısıdır. Bu d ,'Tehlikeli öneri evde/kendi kendine/yakınına uygulama teşviki veya tarifi; risk yok iddiası yanıltıcıdır.',true);body.insertAdjacentHTML('beforeend','<h3>6.6 Ticari yönlendirme</h3>');field(body,'İşaretleyin','t',groups.t,'Video açıklamasını da açın: açıklamadaki randevu telefonu, WhatsApp, adres ya da klinik tanıtımı da sayılır.',true);body.insertAdjacentHTML('beforeend','<h3>6.7 Vaatler</h3>');field(body,'Videoda vaat yok','v_yok',[['1','Vaat yok']],'Yalnız uygulama ve ses varsa vaat yok. Başkasının iddiası aktarılıp reddediliyorsa vaat değildir; video iddiayı doğru diye sunuyorsa vaattir. Her vaat için kanıt kutusunu doldurun.',true);let eg=document.createElement('details');eg.className='examples';eg.innerHTML='<summary>Örnekler — sınırda durumlar</summary><p>“Uygulamadan sonra rahatladı” → boyun ağrısında kısa süreli rahatlama<br>“Boyun düzleşmesini tek hareketle bitir” → kalıcı/tek seansta çözüm + boyun düzleşmesini düzeltme<br>“Atlas terapisiyle işitme kaybı düzeldi” → işitme kaybı + omur yerine oturdu/atlas hizalandı<br>“Ses geldi, omur yerine oturdu” → omur yerine oturdu + ses başarının göstergesi<br>“Ses gaz kabarcığından gelir” → vaat yok; ses yorumu doğru<br>“Migren hastamız” başlığı, başka söz yok → vaat yok; “migren hastamızın ağrısı geçti” → migreni tedavi etme<br>Hasta “kulağım açıldı” der, düzeltilmez → işitme kaybı, kulak tıkanıklığı<br><b>Hastalık adı tek başına vaat değil (v2.1):</b> başlık, açıklama ya da etikette yalnız hastalık adı (fıtık, düzleşme, migren, kulak çınlaması…) geçiyorsa vaat yok; sonuç ya da mekanizma söyleyen ifade gerekir<br>Açıklamada “#boyunağrısı #kayropraktik” → vaat yok<br>Açıklamada “#migren #kulakçınlaması” → vaat yok (etiket)<br>Başlıkta “#boyunfıtığı” → vaat yok<br>“BOYUN DÜZLEŞMESİ EGZERSİZLERİ” → vaat yok (konu başlığı)<br>Açıklamada “…KULAK ÇINLAMASI TEDAVİSİ. ATLAS KEMİĞİ TEDAVİSİ…” → vaat yok (sözcük listesi)<br>“#Boyun ağrısı çekenler” → vaat yok<br>“Boyun ağrısı için çözümler” → vaat yok (genel “çözüm” sözü); “kesin çözüm” → kalıcı/tek seansta çözüm<br>10 sn uygulama, söz yok → vaat yok; ses yorumu “yorumlanmıyor”<br><b>Uygunluk:</b> açıklamada boyun geçmesi dahil etmeye yetmez; videoda boyun manipülasyonu olmalı<br>Uyarı/haber videosu kütletmeyi anlatıyorsa uygulama göstermese de dahil<br><b>Eleştiri videoları:</b> vaat = videonun kendisinin doğru diye sunduğu iddia<br>“Kütletme kulak açar diyorlar, doğru değil” → vaat yok (tür: uyarı)<br>Başkasının kesiti gösterilip reddediliyor → vaat yok<br>“Çıkıkçılar yanlış yapıyor, bizim tekniğimizle fıtık geçer” → fıtığı tedavi etme (kendi vaadi)<br>Kesit gösterilip reddedilmeden geçiliyor → kesitteki vaat kodlanır</p></details>';body.append(eg);V.forEach((x,i)=>{let d=field(body,`${i+1}. ${x[1]}`,'v_'+x[0],[['1','İşaretle']],'Örnek: '+x[2],true);if(r['v_'+x[0]]==='1'){let w=document.createElement('div');w.className='proof';area(w,'Kanıt — '+x[0],'k_'+x[0],"ekran yazısı — 'atlas hizalandı, kulak açıldı'  (uzun videoda: 3:15 konuşma — '…')");d.append(w)}});body.insertAdjacentHTML('beforeend','<h3>6.8 mDISCERN</h3>');MD.forEach(x=>field(body,x[1],x[0],[['1','Evet'],['0','Hayır']],x[2]));let ms=document.createElement('p');ms.id='mdsum';body.append(ms);body.insertAdjacentHTML('beforeend','<h3>6.9 JAMA</h3>');JM.forEach(x=>field(body,x[1],x[0],[['1','Var'],['0','Yok']],x[2]));let js=document.createElement('p');js.id='jamasum';body.append(js);body.insertAdjacentHTML('beforeend','<h3>6.10 GQS</h3>');field(body,'Boyun ağrısı için bilgi arayan bir hasta için bu video ne kadar kaliteli ve yararlı?','gqs',[[1,'Çok düşük'],[2,'Düşük'],[3,'Orta'],[4,'İyi'],[5,'Mükemmel']],'C ya da D vaadi veya tehlikeli öneri varsa en fazla 2. Kısa video olduğu için puan eklenmez.');root.append(body);area(root,'6.11 Açıklama','aciklama','Kararsız kaldığınız her şey','Kararsız kaldığınız her şeyi yazın: hangi iki seçenek arasında kaldığınız, listede olmayan durum, belirsiz unvan. Hariç nedeni Diğer ise zorunlu.');root.append(footer(r));mark(r);if($('#mdsum'))$( function needKeys(r){let n=new Set();if(r.durum!=='yarim')return n;if(!r.dahil)n.add('dahil');if(r.dahil==='hayir'){if(!r.haric_neden)n.add('haric_neden');else if(r.haric_neden==='diger'&&!r.aciklama.trim())n.add('aciklama');return n}for(const k of ['uygulayici','getat','video_turu','ses_yorum',...MD.map(x=>x[0]),...JM.map(x=>x[0]),'gqs'])if(!r[k])n.add(k);for(const [g,a] of Object.entries(groups))if(!a.some(x=>r[x[0]]==='1'))n.add(g);if(r.v_yok!=='1'&&!V.some(x=>r['v_'+x[0]]==='1'))n.add('v_yok');for(const x of V)if(r['v_'+x[0]]==='1'&&!r['k_'+x[0]].trim())n.add('k_'+x[0]);if(r.ses_yorum==='yanlis'&&r.v_D7!=='1'){n.add('v_D7');n.add('ses_yorum')}if((V.some(x=>'CD'.includes(x[0][0])&&r['v_'+x[0]]==='1')||r.s_tehlikeli==='1')&&+r.gqs>2)n.add('gqs');return n}function mark(r){let n=needKeys(r);document.querySelectorAll('#form .question').forEach(q=>q.classList.toggle('need',n.has(q.dataset.key)))}function footer(r){let ft=document.createElement('div');ft.className='formfoot';let m=document.createElement('div');m.className='missing';m.textContent=missing(r).length?'Eksik: '+missing(r).join(', '):'Zorunlu alanlar tamam';if(missing(r).length){m.title='Tıklayın: ilk eksik soruya gider';m.classList.add('go');m.onclick=()=>{let q=document.querySelector('#form .question.need:not(.dim .question)');if(q)q.scrollIntoView({block:'center',behavior:'smooth'})}}ft.append(m);let done=r.durum==='tamam'||r.durum==='haric',nb=document.createElement('button');nb.id='bitirGec';nb.className='nextbtn';nb.disabled=!done;nb.textContent=done?'Tamam — sonraki videoya geç →':'Eksikler tamamlanınca sonraki videoya geçebilirsiniz';nb.onclick=()=>{let n=nextOpen();if(n<0){nb.textContent='Bütün videolar bitti — CSV indirin';nb.disabled=true;return}select(n);$('#form').scrollTop=0;$('#video').scrollTop=0};ft.append(nb);return ft}function typed(){let r=rows[cur];derived(r);r.durum=status(r);r.son_degisiklik=new Date().toISOString();save();count();renderList();let old=$('#form .formfoot');if(old)old.replaceWith(footer(r));mark(r)}function nextOpen(){for(let k=1;k<=VIDEOS.length;k++){let j=(cur+k)%VIDEOS.length;if(rows[j].durum!=='tamam'&&rows[j].durum!=='haric')return j}return -1}function changed(){let r=rows[cur];derived(r);r.durum=status(r);r.son_degisiklik=new Date().toISOString();save();count();renderList();renderForm()}function count(){$('#progress').textContent=rows.filter(x=>x.durum==='tamam'||x.durum==='haric').length+' / '+VIDEOS.length+' bitti'}function select(i){cur=(i+VIDEOS.length)%VIDEOS.length;save();renderList();renderVideo();renderForm()}function csv(){const q=x=>'"'+String(x??'').replace(/"/g,'""')+'"';return '\ufeff'+[COL.map(q).join(','),...rows.map(r=>{derived(r);r.durum=status(r);return COL.map(k=>q(r[k])).join(',')})].join('\r\n')}function download(){let b=new Blob([csv()],{type:'text/csv;charset=utf-8'}),a=document.createElement('a'),d=new Date(),p=n=>String(n).padStart(2,'0');a.href=URL.createObjectURL(b);a.download=`BOYUN_${KIND==='pilot'?'pilot_':''}kodlama_${ID}_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}.csv`;a.click();lastExport=JSON.stringify(rows);$('#dirty').classList.add('hide')}
function parse(t){t=t.replace(/^\ufeff/,'');let a=[],r=[],f='',quoted=false;for(let i=0;i<t.length;i++){let c=t[i];if(quoted){if(c==='"'&&t[i+1]==='"'){f+='"';i++}else if(c==='"')quoted=false;else f+=c}else if(c==='"')quoted=true;else if(c===','){r.push(f);f=''}else if(c==='\n'){r.push(f.replace(/\r$/,''));a.push(r);r=[];f=''}else f+=c}if(quoted)throw Error('CSV kapanmamış tırnak içeriyor');if(f||r.length){r.push(f.replace(/\r$/,''));a.push(r)}let h=a.shift();return a.filter(x=>x.length>1||x[0]).map(x=>Object.fromEntries(h.map((k,i)=>[k,x[i]??''])))}function restoreRows(t){let data=parse(t);if(data.some(x=>x.kodlayici!==ID))throw Error('farklı kodlayıcı');if(data.some(x=>x.form_turu!==KIND))throw Error('farklı form türü');if(!data.length)throw Error('CSV boş');let map=new Map(data.map(x=>[x.video_id,x]));return VIDEOS.map(v=>{let r=blank(v),old=map.get(v.video_id);if(old)COL.forEach(k=>{if(old[k]!==undefined)r[k]=old[k]});derived(r);r.durum=status(r);return r})}function showRestore(t){try{let fresh=restoreRows(t),p=$('#restorePanel');p.replaceChildren(document.createTextNode('CSV geçerli. Mevcut verinin yerine geçecek. '));let y=document.createElement('button');y.textContent='Geri yüklemeyi onayla';y.onclick=()=>{rows=fresh;lastExport='';p.classList.add('hide');save();select(cur)};let n=document.createElement('button');n.textContent='İptal';n.onclick=()=>p.classList.add('hide');p.append(y,n);p.classList.remove('hide')}catch(e){$('#restorePanel').textContent='Geri yükleme reddedildi: '+e.message;$('#restorePanel').classList.remove('hide')}}function init(){try{let x=localStorage.getItem(KEY);if(x){let o=JSON.parse(x);if(o.rows)rows=VIDEOS.map(v=>o.rows.find(q=>q.video_id===v.video_id)||blank(v));cur=Math.max(0,Math.min(VIDEOS.length-1,+o.current||0))}else if(KIND==='main'){let y=localStorage.getItem('boyun_kodlama_v1_'+ID);if(y){let o=JSON.parse(y);if(o.rows){rows=VIDEOS.map(v=>{let q=o.rows.find(q=>q.video_id===v.video_id);return q?Object.assign({},q,{sira:v.sira}):blank(v)});cur=0}}}}catch(e){$('#storageWarn').classList.remove('hide')}rows.forEach(r=>{derived(r);r.durum=status(r)});renderList();renderVideo();renderForm();count();$('#download').onclick=download;$('#restore').onclick=()=>$('#file').click();$('#file').onchange=e=>{let f=e.target.files[0];if(f){let rd=new FileReader();rd.onload=()=>showRestore(String(rd.result));rd.readAsText(f,'utf-8')}};$('#prev').onclick=()=>select(cur-1);$('#next').onclick=()=>select(cur+1);window.addEventListener('keydown',e=>{if(e.altKey&&e.key==='ArrowRight'){e.preventDefault();select(cur+1)}if(e.altKey&&e.key==='ArrowLeft'){e.preventDefault();select(cur-1)}});window.__BOYUN_TEST__={get rows(){return rows},get current(){return cur},get key(){return KEY},select,changed,csv,parse,restoreRows,showRestore,status,missing}}
init()})();
