(()=>{'use strict';const VIDEOS=[{"sira": "1", "video_id": "-2gTND4SXas", "baslik": "Boyun kütletme ve kiropraktik manipülasyon gerçekten masum mu? #ahmetşirin #tinnitus #kbb", "kanal": "Op. Dr. Ahmet Şirin", "yukleme_tarihi": "2026-10-07", "sure_sn": "178", "shorts": "1", "aciklama": "Özellikle tinnitus (kulak çınlaması) yaşayan bazı hastalara, yeterli tıbbi değerlendirme yapılmadan “atlas kemiğiniz kaymış, çınlamanızın nedeni bu” denilerek yüksek hızlı boyun manipülasyonları uygulanabiliyor.\nOysa her tinnitus boyundan kaynaklanmaz ve tinnitusun nedeni yalnızca “atlas kayması” ile açıklanamaz.\nBoyun manipülasyonları sonrasında nadir de olsa boyundaki beyni besleyen damarların duvarında yırtılma (arter diseksiyonu), beyin dolaşımının bozulması ve inme gibi ciddi komplikasyonlar bildirilmiştir. Videoda dünyadan bilinen vakaları ve kendi klinik pratiğimde karşılaştığım durumları da bu nedenle ele alıyorum.\nAmacım tüm kiropraktik uygulamaları kötülemek değil; özellikle tinnitus gibi çok farklı nedenleri olabilen bir şikâyette, yeterli tıbbi değerlendirme ve doğru endikasyon olmadan yapılan yüksek hızlı servikal manipülasyonlara dikkat çekmektir.\nSosyal medyada işlemden hemen sonra hastaya “Çınlaman geçti mi?”, “Kulağın açıldı mı?” diye sorulması da bilimsel olarak tedavi başarısını göstermez. Tinnitusta sonuç, uygun ölçümler ve takip ile değerlendirilmelidir.\nÖnce doğru tanı. Sonra doğru tedavi.\nBu video genel bilgilendirme amaçlıdır; kişisel tıbbi değerlendirme ve muayenenin yerini tutmaz."}, {"sira": "2", "video_id": "sneIYi5bskM", "baslik": "Boyun Ağrısı -  Kayropraktik Tedavisi - Mehmet Toprak", "kanal": "Mehmet Toprak", "yukleme_tarihi": "2021-05-27", "sure_sn": "15", "shorts": "0", "aciklama": "Boyun ağrısı için kayropraktik Tedavisi uygulaması.\n\nBu video sponsorlu değildir.\n\nKayropraktik Nedir?\n“Kayropraktik” yunanca bir kelimedir; chiro (el) ve practic (uygulama) kelimelerinden oluşmaktadır. Yani el ile yapılan tedavi anlamına gelmektedir.\n\nKayropr function renderVideo(){let v=VIDEOS[cur],b=$('#video');b.replaceChildren();let h=document.createElement('h2');h.textContent=v.sira+'. '+v.baslik;b.append(h);let meta=document.createElement('p');meta.textContent=`${v.kanal} · ${Math.floor((+v.sure_sn||0)/60)}:${String((+v.sure_sn||0)%60).padStart(2,'0')} · ${v.yukleme_tarihi}`;b.append(meta);if(location.protocol==='file:'){let w=document.createElement('div');w.className='warning';w.textContent="Video bu sayfada oynatılamıyor (dosya olarak açıldı). YouTube'da aç bağlantısını kullanın.";b.append(w)}else{let p=document.createElement('div');p.className='player';let f=document.createElement('iframe');f.src='https://www.youtube-nocookie.com/embed/'+encodeURIComponent(v.video_id)+'?rel=0';f.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';f.allowFullscreen=true;f.referrerPolicy='strict-origin-when-cross-origin';p.append(f);b.append(p)}let a=document.createElement('a');a.href='https://www.youtube.com/watch?v='+encodeURIComponent(v.video_id);a.textContent="YouTube'da aç";a.target='_blank';a.rel='noopener';b.append(a);let d=document.createElement('details');d.open=true;let s=document.createElement('summary');s.textContent='Video açıklaması';let pre=document.createElement('pre');pre.textContent=v.aciklama||'Açıklama yok';d.append(s,pre);b.append(d)}
function set(k,v,src){let u=U[cur];u.v[k]=v;u.kaynak[k]=src||'elle';if(k==='v'){for(const c of Object.keys(u.kanit))if(v==='yok'||!v.split(',').includes(c))delete u.kanit[c];if(v&&v!=='yok')for(const c of v.split(','))if(!(c in u.kanit))u.kanit[c]=kanitBirlesik(cur,c)}if(k==='dahil'&&v==='evet')delete u.v.haric_neden;changed()}
function changed(){U[cur].son=new Date().toISOString();save();count();renderList();renderKarar()}
function control(it,u){let box=document.createElement('div');box.className='options';let cv=u.v[it.k]||'';if(it.o){for(const [v,l] of it.o){let lb=document.createElement('label'),inp=document.createElement('input');inp.type='radio';inp.name='q_'+it.k;inp.checked=cv===v;inp.onchange=()=>set(it.k,v);lb.append(inp,' '+l);box.append(lb)}}else{let opts=it.set||[['yok','Vaat yok'],...V.map(x=>[x[0],x[0]+' '+x[1]])],none=it.set?it.set[it.set.length-1][0]:'yok',sel=cv?cv.split(','):[];for(const [v,l] of opts){let lb=document.createElement('label'),inp=document.createElement('input');inp.type='checkbox';inp.checked=sel.includes(v);inp.onchange=()=>{let a=sel.filter(x=>x!==v);if(inp.checked){a=v===none?[v]:a.filter(x=>x!==none).concat(v)}let ord=opts.map(x=>x[0]);set(it.k,ord.filter(x=>a.includes(x)).join(','))};lb.append(inp,' '+l);box.append(lb)}}return box}
function renderKarar(){let root=$('#karar'),i=cur,u=U[i],a=K1[i],b=K2[i],fk=farklar(i).map(x=>x.k);root.replaceChildren();let top=document.createElement('div');let fs=document.createElement('div');fs.className='sum';fs.innerHTML=`<span>K1: ${a.dahil==='evet'?'dahil':'hariç'}</span><span>K2: ${b.dahil==='evet'?'dahil':'hariç'}</span><span>${fk.length} farklı madde</span>`;top.append(fs);if((a.aciklama||'').trim()||(b.aciklama||'').trim()){let n=document.createElement('div');n.className='notlar';n.innerHTML='<b>Kodlayıcı notları</b>';for(const [k,r] of [['K1',a],['K2',b]])if((r.aciklama||'').trim()){let p=document.createElement('div');p.textContent=k+': '+r.aciklama;n.append(p)}top.append(n)}if(a.dahil!==b.dahil){let w=document.createElement('p');w.className='small';w.textContent='Bir kodlayıcı videoyu hariç tuttuğu için öteki alanlarda yalnız diğerinin kodlaması var; uzlaşı “dahil” ise hepsini birlikte karara bağlayın.';top.append(w)}let tb=document.createElement('div');tb.className='sum';for(const [k,r] of [['K1',a],['K2',b]]){let bt=document.createElement('button');bt.textContent='Farklı maddelerin hepsini '+k+"'den al";bt.onclick=()=>{for(const it of FLAT){if(!fk.includes(it.k))continue;let x=val(r,it);if(x!=='')set(it.k,x,k)}};tb.append(bt)}top.append(tb);root.append(top);
for(const [sec,...its] of ITEMS){let shown=its.filter(it=>rel(u,it)||(it.k==='dahil'));if(!shown.length)continue;if(sec){let h=document.createElement('h3');h.textContent=sec;root.append(h)}for(const it of shown){let x=val(a,it),y=val(b,it),f=fk.includes(it.k),cv=u.v[it.k]||'',d=document.createElement('div');d.className='item'+(f?' fark':'')+(cv!==''?' ok':'');let lab=document.createElement('div');lab.className='ilabel';lab.textContent=it.l;let st=document.createElement('span');st.className='st '+(cv!==''?'ok':'bek');st.textContent=cv!==''?(f?'✓ karar verildi':'✓ aynı'):(f?'farklı — karar bekliyor':'karar bekliyor');lab.append(st);d.append(lab);if(f||cv===''){let c=document.createElement('div');c.className='cmp';for(const [k,r,v] of [['K1',a,x],['K2',b,y]]){let bt=document.createElement('button');bt.className=cv!==''&&cv===v?'on':'';bt.innerHTML=`<b>${k}</b> `;bt.append(text(it,v));if(it.vaat&&v&&v!=='yok')for(const c2 of v.split(',')){let s=document.createElement('span');s.className='kn';s.textContent=c2+': '+(r['k_'+c2]||'');bt.append(s)}bt.disabled=v==='';bt.title=k+' değerini uzlaşı olarak al';bt.onclick=()=>set(it.k,v,k);c.append(bt)}d.append(c)}let on=(ONERI[VIDEOS[i].sira]||{})[it.k];if(on){let o=document.createElement('div');o.className='oneri';o.innerHTML='<b>Kılavuz v2.0 notu:</b> ';o.append(on);d.append(o)}let det=document.createElement('details');det.open=f||cv==='';let sm=document.createElement('summary');sm.className='small';sm.textContent='Uzlaşı değeri'+(cv!==''?': '+text(it,cv):'');det.append(sm,control(it,u));if(it.vaat&&cv&&cv!=='yok')for(const c2 of cv.split(',')){let w=document.createElement('div');w.className='proof';let l=document.createElement('label');l.textContent='Kanıt — '+c2;let ta=document.createElement('textarea');ta.value=u.kanit[c2]||'';ta.placeholder="yer + kısa alıntı (ör. açıklama — 'KULAK ÇINLAMASI TEDAVİSİ')";ta.oninput=()=>{u.kanit[c2]=ta.value;U[cur].son=new Date().toISOString();save();foot()};w.append(l,ta);det.append(w)}d.append(det);root.append(d)}}
let h=document.createElement('h3');h.textContent='Uzlaşı notu';root.append(h);let ta=document.createElement('textarea');ta.value=u.not;ta.placeholder='Nasıl uzlaşıldı, kılavuza eklenmesi gereken kural, açık kalan soru';ta.oninput=()=>{u.not=ta.value;U[cur].son=new Date().toISOString();save();foot()};root.append(ta);let ft=document.createElement('div');ft.className='foot';ft.id='foot';root.append(ft);foot()}
function foot(){let ft=$('#foot');if(!ft)return;ft.replaceChildren();let m=eksik(cur),st=durum(cur);let x=document.createElement('div');x.className=m.length||st==='bos'?'missing':'donebox';x.textContent=st==='bos'?'Önce dahil kararını verin':m.length?'Karar bekleyen: '+m.join(', '):'Bu videoda uzlaşı tamam';ft.append(x);let nb=document.createElement('button');nb.className='nextbtn';nb.disabled=!!m.length||st==='bos';nb.textContent=nb.disabled?'Kararlar tamamlanınca sonraki videoya geçebilirsiniz':'Tamam — sonraki videoya geç →';nb.onclick=()=>{for(let k=1;k<=VIDEOS.length;k++){let j=(cur+k)%VIDEOS.length;if(!['tamam','haric'].includes(durum(j))){select(j);return}}nb.textContent='Bütün videolar uzlaşıldı — CSV indirin';nb.disabled=true};ft.append(nb);count();renderListStatus()}
function renderListStatus(){let r=document.querySelectorAll('#list .row')[cur];if(r)r.children[1].textContent=({bos:'○',yarim:'◐',tamam:'●',haric:'✕'})[durum(cur)]}
function select(i){cur=(i+VIDEOS.length)%VIDEOS.length;save();renderList();renderVideo();renderKarar();$('#karar').scrollTop=0}
function row(i){let u=U[i],v=VIDEOS[i],r=Object.fromEntries(COL.map(k=>[k,'']));Object.assign(r,{kodlayici:'UZ',form_turu:'pilot_uzlasi',sira:v.sira,video_id:v.video_id,durum:durum(i),dahil:u.v.dahil||'',uzlasi_notu:u.not,son_degisiklik:u.son||''});if(u.v.dahil==='hayir'){r.haric_neden=u.v.haric_neden||'';return r}if(u.v.dahil!=='evet')return r;for(const k of ['uygulayici','getat','video_turu','ses_yorum',...MD.map(x=>x[0]),...JM.map(x=>x[0]),'gqs'])r[k]=u.v[k]||'';for(const g of ['g','s','t'])for(const c of (u.v[g]||'').split(',').filter(Boolean))r[c]='1';let vs=(u.v.v||'').split(',').filter(Boolean);if(vs.includes('yok'))r.v_yok='1';else for(const c of vs){r['v_'+c]='1';r['k_'+c]=u.kanit[c]||''}const sm=a=>a.some(k=>r[k]==='')?'':String(a.reduce((n,k)=>n+(+r[k]||0),0));r.md_toplam=sm(MD.map(x=>x[0]));r.jama_toplam=sm(JM.map(x=>x[0]));let codes=vs.filter(c=>c!=='yok'),cl=codes.filter(c=>c!=='Z').map(c=>c[0]);r.vaat_sayisi=String(codes.length);r.en_yuksek_sinif=cl.includes('D')?'D':cl.includes('C')?'C':cl.includes('B')?'B':cl.includes('A')?'A':codes.includes('Z')?'Z':'';r.kanit_disi=codes.includes('Z')&&!cl.length?'':cl.some(c=>'BCD'.includes(c))?'1':'0';return r}
function csv(){const q=x=>'"'+String(x??'').replace(/"/g,'""')+'"';return '﻿'+[COL.map(q).join(','),...VIDEOS.map((_,i)=>COL.map(k=>q(row(i)[k])).join(','))].join('\r\n')}
function download(){let b=new Blob([csv()],{type:'text/csv;charset=utf-8'}),a=document.createElement('a'),d=new Date(),p=n=>String(n).padStart(2,'0');a.href=URL.createObjectURL(b);a.download=`BOYUN_pilot_uzlasi_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}.csv`;a.click();lastExport=JSON.stringify(U);$('#dirty').classList.add('hide')}
function parse(t){let rows=[],r=[],f='',q=false;t=t.replace(/^﻿/,'');for(let i=0;i<t.length;i++){let c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){r.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;r.push(f);rows.push(r);r=[];f=''}else f+=c}if(f!==''||r.length){r.push(f);rows.push(r)}return rows}
function restore(t){let p=parse(t),h=p[0]||[];if(!h.includes('uzlasi_notu')||!h.includes('video_id'))throw new Error('Bu bir uzlaşı CSV dosyası değil');let n=0;for(const x of p.slice(1)){let r=Object.fromEntries(h.map((k,j)=>[k,x[j]??'']));let i=VIDEOS.findIndex(v=>v.video_id===r.video_id);if(i<0)continue;let u={v:{},kanit:{},not:r.uzlasi_notu||'',kaynak:{},son:r.son_degisiklik||''};for(const it of FLAT){let v=val(r,it);if(v!=='')u.v[it.k]=v}if(u.v.dahil!=='hayir')delete u.v.haric_neden;for(const c of V.map(x=>x[0]))if(r['v_'+c]==='1')u.kanit[c]=r['k_'+c]||'';U[i]=u;n++}save();select(cur);return n}
$('#download').onclick=download;$('#restore').onclick=()=>$('#file').click();$('#file').onchange=async e=>{let f=e.target.files[0];if(!f)return;let m=$('#msg');try{let n=restore(await f.text());m.textContent=n+' video yedekten yüklendi.';m.className='donebox'}catch(err){m.textContent='Yüklenemedi: '+err.message;m.className='alert'}e.target.value=''};$('#prev').onclick=()=>select(cur-1);$('#next').onclick=()=>select(cur+1);
window.addEventListener('beforeunload',e=>{if(JSON.stringify(U)!==lastExport&&U.some(u=>u.son)){e.preventDefault();e.returnValue=''}});
select(cur);window.__uz={U,durum,eksik,farklar,row,csv,restore,set,select:i=>select(i)};})();
</script></body></html>
