function parse(t){t=t.replace(/^\ufeff/,'');let a=[],r=[],f='',quoted=false;for(let i=0;i<t.length;i++){let c=t[i];if(quoted){if(c==='"'&&t[i+1]==='"'){f+='"';i++}else if(c==='"')quoted=false;else f+=c}else if(c==='"')quoted=true;else if(c===','){r.push(f);f=''}else if(c==='\n'){r.push(f.replace(/\r$/,''));a.push(r);r=[];f=''}else f+=c}if(quoted)throw Error('CSV kapanmamış tırnak içeriyor');if(f||r.length){r.push(f.replace(/\r$/,''));a.push(r)}let h=a.shift();return a.filter(x=>x.length>1||x[0]).map(x=>Object.fromEntries(h.map((k,i)=>[k,x[i]??''])))}function restoreRows(t){let data=parse(t);if(data.some(x=>x.kodlayici!==ID))throw Error('farklı kodlayıcı');if(data.some(x=>x.form_turu!==KIND))throw Error('farklı form türü');if(!data.length)throw Error('CSV boş');let map=new Map(data.map(x=>[x.video_id,x]));return VIDEOS.map(v=>{let r=blank(v),old=map.get(v.video_id);if(old)COL.forEach(k=>{if(old[k]!==undefined)r[k]=old[k]});derived(r);r.durum=status(r);return r})}function showRestore(t){try{let fresh=restoreRows(t),p=$('#restorePanel');p.replaceChildren(document.createTextNode('CSV geçerli. Mevcut verinin yerine geçecek. '));let y=document.createElement('button');y.textContent='Geri yüklemeyi onayla';y.onclick=()=>{rows=fresh;lastExport='';p.classList.add('hide');save();select(cur)};let n=document.createElement('button');n.textContent='İptal';n.onclick=()=>p.classList.add('hide');p.append(y,n);p.classList.remove('hide')}catch(e){$('#restorePanel').textContent='Geri yükleme reddedildi: '+e.message;$('#restorePanel').classList.remove('hide')}}function init(){try{let x=localStorage.getItem(KEY);if(x){let o=JSON.parse(x);if(o.rows)rows=VIDEOS.map(v=>o.rows.find(q=>q.video_id===v.video_id)||blank(v));cur=Math.max(0,Math.min(VIDEOS.length-1,+o.current||0))}}catch(e){$('#storageWarn').classList.remove('hide')}rows.forEach(r=>{derived(r);r.durum=status(r)});renderList();renderVideo();renderForm();count();$('#download').onclick=download;$('#restore').onclick=()=>$('#file').cli
